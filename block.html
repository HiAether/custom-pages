<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>访问被阻止</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Sans SC', sans-serif;
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        /* 代码雨效果 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 0;
        }

        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* 扫描线效果 */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 200%;
            background: linear-gradient(
                to bottom,
                transparent 0%,
                rgba(32, 128, 255, 0.2) 50%,
                transparent 100%
            );
            animation: scan 4s linear infinite;
            z-index: 0;
        }

        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: min(8vw, 60px) min(10vw, 80px);
            border-radius: clamp(10px, 3vw, 20px);
            border: 3px solid #2080ff;
            box-shadow: 0 0 50px rgba(32, 128, 255, 0.5), inset 0 0 30px rgba(32, 128, 255, 0.3);
            animation: pulse 2s infinite;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(10px);
            max-width: 90vw;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border: 2px solid #2080ff;
            border-radius: clamp(15px, 3.5vw, 25px);
            animation: borderPulse 1.5s infinite;
            opacity: 0.5;
        }

        .container h1 {
            font-size: clamp(24px, 8vw, 64px);
            margin-bottom: clamp(20px, 5vw, 40px);
            color: #2080ff;
            text-shadow: 0 0 15px rgba(32, 128, 255, 0.8), 0 0 30px rgba(32, 128, 255, 0.6);
            animation: glitch 3s infinite;
            letter-spacing: 2px;
            font-weight: 900;
        }

        .container p {
            font-size: clamp(16px, 4vw, 32px);
            color: #fff;
            margin: clamp(10px, 2.5vw, 20px) 0;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.7), 0 0 15px rgba(32, 128, 255, 0.5);
            animation: shake 0.5s infinite;
            font-weight: 700;
            letter-spacing: 1px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        @keyframes glitch {
            0% { transform: skew(0deg); }
            20% { transform: skew(-3deg); opacity: 0.8; }
            40% { transform: skew(3deg); opacity: 1; }
            60% { transform: skew(-3deg); opacity: 0.9; }
            80% { transform: skew(3deg); opacity: 1; }
            100% { transform: skew(0deg); }
        }

        @keyframes shake {
            0% { transform: translateX(0) translateY(0); }
            25% { transform: translateX(2px) translateY(-2px); }
            50% { transform: translateX(-2px) translateY(2px); }
            75% { transform: translateX(2px) translateY(-2px); }
            100% { transform: translateX(0) translateY(0); }
        }

        @keyframes borderPulse {
            0% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 0.5; }
        }

        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(0); }
        }
    </style>
</head>
<body>
    <canvas class="matrix-bg"></canvas>
    <div class="container">
        <h1>装黑客来打你爹？</h1>
        <p>你TM也配？</p>
        <p>滚回去多练练吧！</p>
        <p>菜的抠脚还敢来送？</p>
    </div>

    <script>
        // 炫酷黑客效果
        const canvas = document.querySelector('.matrix-bg');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = "菜逼回家多练练还来打你爹";
        const fontSize = 20;
        const columns = canvas.width / fontSize;
        const drops = [];
        const colors = ['#2080ff', '#ff2080', '#80ff20', '#ffffff'];

        for(let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for(let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                ctx.fillStyle = color;
                ctx.font = `${fontSize}px "Noto Sans SC"`;
                ctx.shadowBlur = 15;
                ctx.shadowColor = color;
                
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                ctx.shadowBlur = 0;

                if(drops[i] * fontSize > canvas.height && Math.random() > 0.95) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(draw, 50);

        // 窗口大小改变时重置画布大小
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
