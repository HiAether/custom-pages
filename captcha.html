<html lang="en">
<head>
  <title>Security Challenge | layer7.wiki</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <style>
    :root {
      --primary: #8b5cf6;
      --text: #1f2937;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--text);
      line-height: 1.6;
      background: linear-gradient(-45deg, #f8f9fa, #e2e8f0, #cbd5e1, #94a3b8);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .interaction-prompt {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(135deg,#fff,#f3e8ff);
      padding: clamp(16px, 3vw, 24px);
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(139,92,246,0.15);
      font-size: clamp(1rem, 2vw, 1.2rem);
      font-weight: 500;
      text-align: center;
      z-index: 1000;
    }
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
  <script>
    window.onload = function() {
      const prompt = document.createElement('div');
      prompt.className = 'interaction-prompt';
      
      if ('ontouchstart' in window) {
        prompt.textContent = 'Please scroll to continue...';
      } else {
        prompt.textContent = 'Please move your mouse to continue...';
      }
      document.body.appendChild(prompt);

      function loadMainPage() {
        window.location.href = 'main.html';
      }

      if ('ontouchstart' in window) {
        document.addEventListener('touchmove', loadMainPage, {once: true, passive: true});
        document.addEventListener('scroll', loadMainPage, {once: true, passive: true});
      } else {
        document.addEventListener('mousemove', loadMainPage, {once: true});
      }
    };
  </script>
</head>
<body>
</body>
</html>
